name: Social publishing heartbeat

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: hooma-social-publishing-heartbeat
  cancel-in-progress: false

jobs:
  publish-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Run authenticated Hooma social worker
        env:
          HOOMA_CRON_SECRET: ${{ secrets.HOOMA_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${HOOMA_CRON_SECRET:-}" ]]; then
            echo "::error::HOOMA_CRON_SECRET is not configured"
            exit 1
          fi
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${HOOMA_CRON_SECRET}" \
            --header "Accept: application/json" \
            https://hooma.ge/api/cron/social-publish)"
          summary="$(jq -c '{
            ok,
            status,
            instagram: {
              publishing: {status: .instagram.publishing.status, errorCode: .instagram.publishing.result.errorCode},
              analytics: {status: .instagram.analytics.status, errorCode: .instagram.analytics.result.errorCode}
            },
            tiktok: {
              publishing: {status: .tiktok.publishing.status, errorCode: .tiktok.publishing.result.errorCode},
              analytics: {status: .tiktok.analytics.status, errorCode: .tiktok.analytics.result.errorCode}
            }
          }' "$response_file" 2>/dev/null || printf '%s' '{"status":"INVALID_JSON"}')"
          echo "Hooma social worker HTTP ${status}: ${summary}"
          test "$status" = "200"
          jq -e '.ok == true and .status == "COMPLETE"' "$response_file" >/dev/null
